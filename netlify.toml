[build]
  command = "npm run build"
  publish = "dist"

# Prerendered files in dist/ win over this; everything else falls back to the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/blog-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
