[build]
  command = "npm run build"
  publish = "dist"

# Every route is prerendered to a real file, so unknown URLs fall through to dist/404.html (404 status).

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/blog-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/attorney-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
